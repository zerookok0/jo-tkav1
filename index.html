<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0709" />

    <title>نايتايل · من حولك، على بعد ثلاثة كيلومترات</title>
    <meta
      name="description"
      content="مجتمع ليلي داخل مدينتك. لقطات حقيقية في نطاق ثلاثة كيلومترات، بلا إضافة أصدقاء، مرّر لتشاهد. وجوه مخفية، ومغيّر صوت بالذكاء الاصطناعي، ورسائل تختفي بعد القراءة. للبالغين +18 فقط."
    />
    <meta name="robots" content="index,follow" />

    <!-- 社交分享卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ضوءُها ما زال مضاءً، على بعد 480 مترًا." />
    <meta
      property="og:description"
      content="ثلاثة كيلومترات حولك، الآن. بلا إضافة أصدقاء، مرّر لتشاهد. تحميل مجاني لأندرويد، +18 فقط."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="preconnect" href="https://videos.pexels.com" />
    <!--
      字体不阻塞首屏。
      三个 Google 字体原本是同步样式表：浏览器会停在这里等几百毫秒，
      白屏时间直接拉长。改成 preload + onload 应用，
      先用系统字体把页面画出来，字体到了再替换（font-display: swap 效果）。
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
